
<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#087f5b">
  <title>NegosyoHub PH</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f7f5;
      color: #222;
    }
    header {
      background: #087f5b;
      color: white;
      text-align: center;
      padding: 22px 12px;
    }
    main {
      max-width: 700px;
      margin: auto;
      padding: 16px;
    }
    .card {
      background: white;
      padding: 18px;
      margin-bottom: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #0001;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }
    button {
      padding: 12px;
      margin: 4px 0;
      border: 0;
      border-radius: 7px;
      background: #087f5b;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }
    .full { width: 100%; }
    .menu {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }
    .hidden { display: none; }
    #message { overflow-wrap: anywhere; }
  </style>
</head>

<body>
<header>
  <h1>NegosyoHub PH</h1>
  <p>Kaagapay sa iyong negosyo!</p>
</header>

<main>
  <section class="card" id="authSection">
    <h2>Mag-login o Gumawa ng Account</h2>
    <input id="email" type="email" placeholder="Email address"
           autocomplete="email">
    <input id="password" type="password" placeholder="Password"
           autocomplete="current-password">

    <button class="full" onclick="signIn()">Login</button>
    <button class="full" onclick="signUp()">Gumawa ng Account</button>
    <p id="message" role="status"></p>
  </section>

  <section class="card hidden" id="dashboard">
    <h2>Dashboard</h2>
    <p id="welcome"></p>

    <div class="menu">
      <button onclick="showFeature('📦 Produkto')">📦 Produkto</button>
      <button onclick="showFeature('💰 Benta')">💰 Benta</button>
      <button onclick="showFeature('👥 Customers')">👥 Customers</button>
      <button onclick="showFeature('📝 Utang')">📝 Utang</button>
      <button onclick="showFeature('📊 Reports')">📊 Reports</button>
      <button onclick="showFeature('🏪 Impormasyon ng Negosyo')">🏪 Negosyo</button>
    </div>

    <div id="feature" class="card">
      Pumili ng feature sa itaas.
    </div>

    <button onclick="signOut()">Logout</button>
  </section>
</main>

<script>
  // SUPABASE PROJECT SETTINGS
  const SUPABASE_URL =
    'https://qdylgqxcqivdqpcwhwjp.supabase.co';

  const SUPABASE_PUBLISHABLE_KEY =
    'sb_publishable_1O4HW3947xic0GQgUPGxxQ_XJxwrKis';

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  async function signUp() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const message = document.getElementById('message');

    if (!email || password.length < 6) {
      message.textContent =
        'Ilagay ang tamang email at password na hindi bababa sa 6 na character.';
      return;
    }

    message.textContent = 'Gumagawa ng account...';

    const { data, error } = await db.auth.signUp({
      email,
      password
    });

    if (error) {
      message.textContent = 'Hindi nagtagumpay: ' + error.message;
      return;
    }

    message.textContent = data.session
      ? 'Matagumpay ang registration!'
      : 'Tingnan ang email para sa confirmation link kung hinihingi ito.';

    if (data.session) showDashboard(data.session.user);
  }

  async function signIn() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const message = document.getElementById('message');

    message.textContent = 'Nagla-login...';

    const { data, error } = await db.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      message.textContent = 'Hindi makapag-login: ' + error.message;
      return;
    }

    showDashboard(data.user);
  }

  function showDashboard(user) {
    document.getElementById('authSection').classList.add('hidden');
    document.getElementById('dashboard').classList.remove('hidden');
    document.getElementById('welcome').textContent =
      'Naka-login bilang ' + user.email;
  }

  function showFeature(name) {
    document.getElementById('feature').textContent =
      name + ': Susunod nating ikokonekta ang feature na ito sa database.';
  }

  async function signOut() {
    const { error } = await db.auth.signOut();

    if (error) {
      alert('Hindi nakapag-logout: ' + error.message);
      return;
    }

    document.getElementById('dashboard').classList.add('hidden');
    document.getElementById('authSection').classList.remove('hidden');
    document.getElementById('message').textContent = 'Naka-logout ka na.';
  }

  async function checkSession() {
    const { data } = await db.auth.getSession();

    if (data.session) showDashboard(data.session.user);
  }

  checkSession();
</script>
</body>
</html>
