  async function signUp() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const message = document.getElementById('message');

    if (!email || password.length < 6) {
      message.textContent =
        'Ilagay ang email at password na hindi bababa sa 6 na character.';
      return;
    }

    message.textContent = 'Gumagawa ng account...';

    const { data, error } = await db.auth.signUp({
      email,
      password,
      options: { emailRedirectTo: SITE_URL }
    });

    if (error) {
      message.textContent = 'Error: ' + error.message;
      return;
    }

    if (data.session) {
      await showDashboard(data.session.user);
    } else {
      message.textContent =
        'Tingnan ang email mo at pindutin ang confirmation link.';
    }
  }

  async function signIn() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const message = document.getElementById('message');

    if (!email || !password) {
      message.textContent = 'Ilagay ang email at password.';
      return;
    }

    message.textContent = 'Nagla-login...';

    const { data, error } = await db.auth.signInWithPassword({
      email,
      password
      
    });

    if (error) {
      message.textContent = 'Login error: ' + error.message;
      return;
    }

    await showDashboard(data.user);
    
    startAutomaticBackup();
  }

  async function showDashboard(user) {
    currentUser = user;
    currentBusinessId = null;

    document.getElementById('authSection').classList.add('hidden');
    document.getElementById('dashboard').classList.remove('hidden');
    document.getElementById('welcome').textContent =
      'Naka-login bilang ' + (user.email || '');

    try {
      await getBusinessId();
    } catch (error) {
      document.getElementById('message').textContent =
        'Hindi makuha ang negosyo: ' + error.message;
    }
  }

  async function getBusinessId() {
    if (currentBusinessId) return currentBusinessId;

    if (!currentUser) {
      throw new Error('Mag-login muna sa account mo.');
    }

    const { data, error } = await db
      .from('businesses')
      .select('id')
      .eq('owner_id', currentUser.id)
      .limit(1);

    if (error) {
      throw new Error('Hindi makuha ang negosyo: ' + error.message);
    }

    if (!data || data.length === 0) {
      throw new Error('Walang negosyong naka-link sa account mo.');
    }

    currentBusinessId = data[0].id;
    return currentBusinessId;
  }

function showPOSMessage(message, isError = false) {
  const el = document.getElementById('posMessage');
  if (!el) return;
  el.textContent = message;
  el.style.color = isError ? 'red' : 'green';
}

function addPOSBarcode() {
  const input = document.getElementById('posBarcode');
  if (!input) return;

  const barcode = input.value.trim();
  if (!barcode) return;

  const product = productsCache.find(
    p => String(p.barcode || '').trim() === barcode
  );

  if (!product) {
    showPOSMessage('Hindi makita ang barcode na ' + barcode, true);
    input.select();
    return;
  }

  const existing = posCart.find(item => item.id === product.id);
  const currentQty = existing ? existing.quantity : 0;
  const stock = Number(product.stock_quantity || 0);

  if (currentQty + 1 > stock) {
    showPOSMessage('Kulang ang stock ng ' + product.name, true);
    input.value = '';
    input.focus();
    return;
  }

  if (existing) {
    existing.quantity += 1;
  } else {
    posCart.push({
      id: product.id,
      name: product.name,
      barcode: product.barcode || '',
      price: Number(product.selling_price || 0),
      quantity: 1,
      stock: stock
    });
  }

  input.value = '';
  renderPOSCart();
  showPOSMessage('Naidagdag: ' + product.name);
  input.focus();
}

function renderPOSCart() {
  const cart = document.getElementById('posCart');
  if (!cart) return;

  if (posCart.length === 0) {
    cart.textContent = 'Wala pang produktong naidaragdag.';
  } else {
    cart.innerHTML = posCart.map((item, index) => `
      <div class="product">
        <strong>${escapeHTML(item.name)}</strong>
        <p>Presyo: ₱${item.price.toFixed(2)}</p>
        <label>Dami</label>
        <input type="number" min="1" max="${item.stock}"
          value="${item.quantity}"
          onchange="changePOSQuantity(${index}, this.value)">
        <p>Subtotal: ₱${(item.price * item.quantity).toFixed(2)}</p>
        <button type="button" onclick="removePOSItem(${index})">
          Alisin
        </button>
      </div>
    `).join('');
  }

  const qty = posCart.reduce((sum, item) => sum + item.quantity, 0);
  const total = posCart.reduce(
    (sum, item) => sum + item.price * item.quantity, 0
  );

  document.getElementById('posTotalQty').textContent = qty;
  document.getElementById('posTotal').textContent =
    '₱' + total.toFixed(2);

  updatePOSPayment();
}

function changePOSQuantity(index, value) {
  const item = posCart[index];
  if (!item) return;

  const qty = Number(value);
  if (!Number.isInteger(qty) || qty < 1 || qty > item.stock) {
    showPOSMessage('Hindi puwede ang daming iyan. Stock: ' + item.stock, true);
    renderPOSCart();
    return;
  }

  item.quantity = qty;
  renderPOSCart();
}

function removePOSItem(index) {
  posCart.splice(index, 1);
  renderPOSCart();
}

function clearPOSCart() {
  posCart = [];
  renderPOSCart();
  showPOSMessage('Na-clear ang listahan ng pinamili.');
}

function updatePOSPayment() {
  const paymentEl = document.getElementById('posPayment');
  const changeEl = document.getElementById('posChange');
  if (!paymentEl || !changeEl) return;

  const total = posCart.reduce(
    (sum, item) => sum + item.price * item.quantity, 0
  );
  const payment = Number(paymentEl.value || 0);
  const change = payment - total;

  changeEl.textContent =
    '₱' + Math.max(0, change).toFixed(2);
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  })[char]);
}

async function startPosScanner() {
  const scannerElement = document.getElementById('posScanner');

  if (!scannerElement) return;

  if (typeof Html5Qrcode === 'undefined') {
    showPOSMessage(
      'Hindi pa nakakarga ang camera scanner library. Kailangan muna itong ayusin.',
      true
    );
    return;
  }

  scannerElement.style.display = 'block';

  try {
    if (posScanner) {
      await posScanner.stop().catch(() => {});
      posScanner.clear();
    }

    posScanner = new Html5Qrcode('posScanner');

    await posScanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 250, height: 150 } },
      async (decodedText) => {
        const input = document.getElementById('posBarcode');
        if (input) input.value = decodedText;

        await posScanner.stop();
        posScanner.clear();
        posScanner = null;
        scannerElement.style.display = 'none';

        addPOSBarcode();
      },
      () => {}
    );

    showPOSMessage('Itapat ang camera sa barcode ng produkto.');
  } catch (error) {
    showPOSMessage(
      'Hindi mabuksan ang camera. Payagan ang camera access at subukan ulit.',
      true
    );
    console.error(error);
  }
}

  async function saveSale(event) {
    event.preventDefault();

    const message = document.getElementById('saleMessage');
    const button = document.getElementById('saveSale');

    button.disabled = true;
    message.textContent = 'Sine-save ang benta...';

    let saleSaved = false;

    try {
      const businessId = await getBusinessId();
      const productId = document.getElementById('saleProduct').value;
      const quantity = Number(document.getElementById('saleQty').value);
      const sellingPrice = Number(document.getElementById('salePrice').value);

      if (!productId) throw new Error('Pumili ng produkto.');

      if (!Number.isInteger(quantity) || quantity < 1) {
        throw new Error('Ilagay ang wastong dami ng nabenta.');
      }

      if (!Number.isFinite(sellingPrice) || sellingPrice < 0) {
        throw new Error('Suriin ang presyo ng benta.');
      }

      // Kunin ang pinakabagong stock bago mag-record ng benta.
      const { data: product, error: productError } = await db
        .from('products')
        .select('id,name,cost_price,selling_price,stock_quantity')
        .eq('id', productId)
        .eq('business_id', businessId)
        .single();

      if (productError) throw productError;

      if (quantity > Number(product.stock_quantity)) {
        throw new Error(
          'Kulang ang stock. Ang natitirang stock ay ' +
          product.stock_quantity + '.'
        );
      }

      const totalAmount = quantity * sellingPrice;

      // I-record muna ang benta.
      const { error: saleError } = await db
        .from('sales')
        .insert({
          business_id: businessId,
          product_id: product.id,
          quantity: quantity,
          selling_price: sellingPrice,
          total_amount: totalAmount,
          cost_price_at_sale: Number(product.cost_price || 0),
          sell_date: new Date().toISOString(),
        });

      if (saleError) throw saleError;
      saleSaved = true;

      // Bawasan ang stock.
      const newStock = Number(product.stock_quantity) - quantity;

      const { data: updatedProduct, error: stockError } = await db
        .from('products')
        .update({ stock_quantity: newStock })
        .eq('id', product.id)
        .eq('business_id', businessId)
        .eq('stock_quantity', Number(product.stock_quantity))
        .select('id')
        .maybeSingle();

      if (stockError) {
        throw new Error(
          'NA-RECORD ANG BENTA PERO HINDI NABAWAS ANG STOCK. ' +
          'Huwag ulitin ang benta. Error: ' + stockError.message
        );
      }

      if (!updatedProduct) {
        throw new Error(
          'NA-RECORD ANG BENTA PERO HINDI NA-UPDATE ANG STOCK. ' +
          'Huwag ulitin ang benta. I-refresh at suriin muna ang stock.'
        );
      }

// Hindi kailangan ang process_sale_stock RPC dito dahil na-update na
      // ang stock sa itaas sa pamamagitan ng products.update().

      document.getElementById('saleForm').reset();

      message.textContent =
        'Matagumpay ang benta! Kabuuan: ₱' +
        totalAmount.toFixed(2) +
        '. Nabawasan ang stock ng ' + quantity + '.';

      await loadSaleProducts();
      updateSalePreview();

    } catch (error) {
      message.textContent =
        (saleSaved ? 'BABALA: Maaaring na-save na ang benta. ' : 'Hindi na-save: ') +
        error.message;
    } finally {
      button.disabled = false;
    }
  }

  async function loadDebts() {
    const list = document.getElementById('debtList');
    if (!list) return;

    list.textContent = 'Kinukuha ang mga utang...';

    try {
      const businessId = await getBusinessId();

      const { data: debts, error: debtError } = await db
        .from('debts')
        .select('id,customer_id,amount,amount_paid,notes,created_at')
        .eq('business_id', businessId)
        .order('created_at', { ascending: false });

      if (debtError) throw debtError;

      const { data: customers, error: customerError } = await db
        .from('customers')
        .select('id,name')
        .eq('business_id', businessId);

      if (customerError) throw customerError;

      const { data: payments, error: paymentError } = await db
        .from('debt_payments')
        .select('id,debt_id,amount,payment_date,notes')
        .eq('business_id', businessId)
        .order('payment_date', { ascending: false });

      if (paymentError) throw paymentError;

      const customerNames = new Map(
        (customers || []).map(c => [c.id, c.name])
      );

      list.replaceChildren();

      const records = debts || [];

      if (!records.length) {
        list.textContent = 'Wala pang naitalang utang.';
        return;
      }

      records.forEach(debt => {
        const item = document.createElement('div');
        item.className = 'product';

        const total = Number(debt.amount || 0);
        const paid = Number(debt.amount_paid || 0);
        const balance = Math.max(0, total - paid);

        const title = document.createElement('strong');
        title.textContent =
          customerNames.get(debt.customer_id) || 'Hindi kilalang customer';

        const details = document.createElement('p');
        details.textContent =
          'Petsa: ' + new Date(debt.created_at).toLocaleDateString('en-PH') +
          ' | Kabuuang utang: ₱' + total.toFixed(2);

        const payment = document.createElement('p');
        payment.textContent = 'Naibayad: ₱' + paid.toFixed(2);

        const remaining = document.createElement('p');
        remaining.textContent = 'Natitirang utang: ₱' + balance.toFixed(2);
        remaining.style.fontWeight = 'bold';

        const status = document.createElement('p');
        status.textContent =
          balance <= 0 ? '✅ FULLY PAID' : '⏳ MAY BALANSE PA';

        item.append(title, details, payment, remaining, status);

        if (debt.notes) {
          const note = document.createElement('p');
          note.textContent = 'Notes: ' + debt.notes;
          item.appendChild(note);
        }

        const historyTitle = document.createElement('h4');
        historyTitle.textContent = 'Kasaysayan ng Bayad';
        item.appendChild(historyTitle);

        const debtPayments = (payments || []).filter(
          p => p.debt_id === debt.id
        );

        if (!debtPayments.length) {
          const noPayment = document.createElement('p');
          noPayment.textContent = 'Wala pang naitatalang bayad.';
          item.appendChild(noPayment);
        } else {
          debtPayments.forEach(p => {
            const paymentDetails = document.createElement('p');
            paymentDetails.textContent =
              new Date(p.payment_date).toLocaleDateString('en-PH') +
              ' — ₱' + Number(p.amount).toFixed(2) +
              (p.notes ? ' (' + p.notes + ')' : '');

            item.appendChild(paymentDetails);
          });
        }

        if (balance > 0) {
          const paymentTitle = document.createElement('h4');
          paymentTitle.textContent = 'Mag-record ng Bayad';

          const amountInput = document.createElement('input');
          amountInput.type = 'number';
          amountInput.min = '0.01';
          amountInput.max = balance.toFixed(2);
          amountInput.step = '0.01';
          amountInput.placeholder = 'Halaga ng ibinayad (₱)';

          const notesInput = document.createElement('input');
          notesInput.type = 'text';
          notesInput.maxLength = 250;
          notesInput.placeholder = 'Notes sa bayad (opsyonal)';

          const payButton = document.createElement('button');
          payButton.type = 'button';
          payButton.textContent = 'I-record ang Bayad';

          payButton.addEventListener('click', async () => {
            const amount = Number(amountInput.value);
            const message = document.getElementById('debtMessage');

            try {
              if (!Number.isFinite(amount) || amount <= 0) {
                throw new Error('Ilagay ang wastong halaga ng bayad.');
              }

              if (amount > balance + 0.000001) {
                throw new Error(
                  'Sobra ang bayad. Natitirang balanse: ₱' +
                  balance.toFixed(2)
                );
              }

              payButton.disabled = true;
              message.textContent = 'Sine-save ang bayad...';

              const { data, error } = await db.rpc(
                'record_debt_payment',
                {
                  p_debt_id: debt.id,
                  p_amount: amount,
                  p_notes: notesInput.value.trim() || null
                }
              );

              if (error) throw error;

              message.textContent =
                'Matagumpay na naitala ang bayad! Natitirang balanse: ₱' +
                Number(data.remaining_balance).toFixed(2);

              await loadDebts();

            } catch (error) {
              message.textContent =
                'Hindi naitala ang bayad: ' + error.message;
            } finally {
              payButton.disabled = false;
            }
          });

          item.append(paymentTitle, amountInput, notesInput, payButton);
        }

        list.appendChild(item);
      });

    } catch (error) {
      list.textContent = 'Hindi makuha ang mga utang: ' + error.message;
    }
  }

  async function loadDashboardAnalytics() {
    const message = document.getElementById('analyticsMessage');
    const dashboard = document.getElementById('analyticsDashboard');

    if (!dashboard) return;

    message.textContent = 'Kinukuha ang business analytics...';
    dashboard.replaceChildren();

    try {
      const businessId = await getBusinessId();

      const results = await Promise.all([
        db.from('sales')
          .select('id,product_id,quantity,total_amount,cost_price_at_sale,sell_date')
          .eq('business_id', businessId),

        db.from('products')
          .select('id,name,cost_price,stock_quantity')
          .eq('business_id', businessId),

        db.from('expenses')
          .select('amount,expense_date')
          .eq('business_id', businessId),

        db.from('debts')
          .select('amount,amount_paid')
          .eq('business_id', businessId)
      ]);

      const [salesResult, productsResult, expensesResult, debtsResult] = results;

      if (salesResult.error) throw salesResult.error;
      if (productsResult.error) throw productsResult.error;
      if (expensesResult.error) throw expensesResult.error;
      if (debtsResult.error) throw debtsResult.error;

      const sales = salesResult.data || [];
      const products = productsResult.data || [];
      const expenses = expensesResult.data || [];
      const debts = debtsResult.data || [];

      const productMap = new Map(
        products.map(p => [p.id, p])
      );

      let totalSales = 0;
      let totalCost = 0;
      let estimatedProfit = 0;
      let estimatedRecords = 0;
      let todaySales = 0;
      let monthlySales = 0;

      const dateParts = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Asia/Manila',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      }).formatToParts(new Date());

      const dateValues = Object.fromEntries(
        dateParts.map(p => [p.type, p.value])
      );

      const today = `${dateValues.year}-${dateValues.month}-${dateValues.day}`;
      const month = today.slice(0, 7);

      sales.forEach(sale => {
        const quantity = Number(sale.quantity || 0);
        const amount = Number(sale.total_amount || 0);

        totalSales += amount;

        
const saleDate = sale.sell_date
  ? sale.sell_date.slice(0, 10)
  : '';

if (saleDate === today) {
  todaySales += amount;
}

if (saleDate && saleDate.startsWith(month)) {
  monthlySales += amount;
}
        const product = productMap.get(sale.product_id);

        let unitCost;

        if (sale.cost_price_at_sale !== null &&
            sale.cost_price_at_sale !== undefined) {
          unitCost = Number(sale.cost_price_at_sale);
        } else {
          unitCost = Number(product?.cost_price || 0);
          estimatedRecords++;
        }

        const cost = unitCost * quantity;

        totalCost += cost;
        estimatedProfit += amount - cost;
      });

      const totalExpenses = expenses.reduce(
        (sum, e) => sum + Number(e.amount || 0), 0
      );

      const todayExpenses = expenses
        .filter(e => e.expense_date === today)
        .reduce((sum, e) => sum + Number(e.amount || 0), 0);

      const monthlyExpenses = expenses
        .filter(e => e.expense_date && e.expense_date.startsWith(month))
        .reduce((sum, e) => sum + Number(e.amount || 0), 0);

      const inventoryValue = products.reduce(
        (sum, p) =>
          sum + Number(p.stock_quantity || 0) *
          Number(p.cost_price || 0),
        0
      );

      const outstandingDebts = debts.reduce(
        (sum, d) =>
          sum + Math.max(
            0,
            Number(d.amount || 0) - Number(d.amount_paid || 0)
          ),
        0
      );

      const estimatedNetProfit = estimatedProfit - totalExpenses;

      const money = value =>
        '₱' + Number(value).toLocaleString('en-PH', {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        });

      const metrics = [
        ['Kabuuang Benta', money(totalSales), 'Lahat ng sales records'],
        ['Bilang ng Transaksyon', sales.length, 'Kabuuang sales records'],
        ['Benta Ngayong Araw', money(todaySales), today],
        ['Benta Ngayong Buwan', money(monthlySales), month],
        ['Estimated Product Cost', money(totalCost), 'Puhunan ng mga nabentang produkto'],
        ['Estimated Gross Profit', money(estimatedProfit), 'Benta minus product cost'],
        ['Kabuuang Gastos', money(totalExpenses), expenses.length + ' expense records'],
        ['Gastos Ngayong Araw', money(todayExpenses), 'Expenses today'],
        ['Gastos Ngayong Buwan', money(monthlyExpenses), 'Expenses this month'],
        ['Estimated Net Profit', money(estimatedNetProfit), 'Gross profit minus expenses'],
        ['Inventory Value', money(inventoryValue), 'Kasalukuyang stock at puhunan'],
        ['Outstanding Debts', money(outstandingDebts), debts.length + ' debt records']
      ];

      metrics.forEach(metric => {
        const card = document.createElement('div');
        card.className = 'product';

        const title = document.createElement('strong');
        title.textContent = metric[0];

        const value = document.createElement('h3');
        value.textContent = metric[1];

        const detail = document.createElement('p');
        detail.className = 'muted';
        detail.textContent = metric[2];

        card.append(title, value, detail);
        dashboard.appendChild(card);
      });

      message.textContent =
        'Matagumpay na nakuha ang Dashboard Analytics! ' +
        (estimatedRecords
          ? estimatedRecords + ' sales record(s) ang gumagamit ng kasalukuyang product cost bilang estimate.'
          : 'Lahat ng sales ay may recorded historical cost.');

    } catch (error) {
      message.textContent =
        'Hindi makuha ang Dashboard Analytics: ' + error.message;
    }
  }

        db.from('sales')
          .select('id,product_id,quantity,selling_price,total_amount,cost_price_at_sale,sell_date,sale_date')
          .eq('business_id', businessId),

        db.from('products')
          .select('id,name,cost_price,stock_quantity,low_stock_level')
          .eq('business_id', businessId),

        db.from('expenses')
          .select('id,category,description,amount,expense_date,created_at')
          .eq('business_id', businessId),

        db.from('debts')
          .select('id,customer_id,amount,amount_paid,notes,created_at')
          .eq('business_id', businessId),

        db.from('customers')
          .select('id,name')
          .eq('business_id', businessId)
      ]);

      const [salesResult, productsResult, expensesResult, debtsResult, customersResult] = results;

      if (salesResult.error) throw salesResult.error;
      if (productsResult.error) throw productsResult.error;
      if (expensesResult.error) throw expensesResult.error;
      if (debtsResult.error) throw debtsResult.error;
      if (customersResult.error) throw customersResult.error;

      const products = productsResult.data || [];
      const productMap = new Map(
        products.map(p => [p.id, p])
      );

      const customerNames = new Map(
        (customersResult.data || []).map(c => [c.id, c.name])
      );

      const allSales = salesResult.data || [];
      const allExpenses = expensesResult.data || [];
      const allDebts = debtsResult.data || [];

      const getDate = value => {
        if (!value) return '';
        return String(value).slice(0, 10);
      };

      const inRange = date => {
        const value = getDate(date);
        return Boolean(value) &&
          (!start || value >= start) &&
          (!end || value <= end);
      };

      const sales = allSales.filter(s => 
        inRange(s.sell_date || s.sale_date)
      );

      const expenses = allExpenses.filter(e =>
        inRange(e.expense_date)
      );

      const money = value =>
        '₱' + Number(value || 0).toLocaleString('en-PH', {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        });

      const titles = {
        sales: 'Sales Report',
        profit: 'Profit and Loss Report',
        expenses: 'Expense Report',
        inventory: 'Inventory Report',
        debts: 'Outstanding Debt Report'
      };

      title.textContent = titles[reportType] || 'Business Report';

      period.textContent =
        reportType === 'inventory' || reportType === 'debts'
          ? 'Kasalukuyang snapshot — hindi sakop ng date filter.'
          : 'Panahon: ' + (start || 'Lahat') + ' hanggang ' + (end || 'Lahat');

      const addSummary = (label, value) => {
        const card = document.createElement('div');
        card.className = 'product';

        const heading = document.createElement('strong');
        heading.textContent = label;

        const amount = document.createElement('h3');
        amount.textContent = value;

        card.append(heading, amount);
        summary.appendChild(card);
      };

      const addTable = (headers, rows) => {
        const table = document.createElement('table');
        table.style.width = '100%';
        table.style.borderCollapse = 'collapse';
        table.style.marginTop = '12px';

        const thead = document.createElement('thead');
        const headerRow = document.createElement('tr');

        headers.forEach(header => {
          const th = document.createElement('th');
          th.textContent = header;
          th.style.textAlign = 'left';
          th.style.padding = '8px';
          th.style.borderBottom = '1px solid #999';
          headerRow.appendChild(th);
        });

        thead.appendChild(headerRow);
        table.appendChild(thead);

        const tbody = document.createElement('tbody');

        rows.forEach(row => {
          const tr = document.createElement('tr');

          row.forEach(value => {
            const td = document.createElement('td');
            td.textContent = String(value ?? '');
            td.style.padding = '8px';
            td.style.borderBottom = '1px solid #ddd';
            tr.appendChild(td);
          });

          tbody.appendChild(tr);
        });

        table.appendChild(tbody);
        details.appendChild(table);
      };

      if (reportType === 'sales') {
        const total = sales.reduce(
          (sum, s) => sum + Number(s.total_amount || 0), 0
        );

        addSummary('Kabuuang Benta', money(total));
        addSummary('Bilang ng Transaksyon', sales.length);

        addTable(
          ['Petsa', 'Produkto', 'Quantity', 'Selling Price', 'Total'],
          sales.map(s => [
            getDate(s.sell_date || s.sale_date),
            productMap.get(s.product_id)?.name || 'Hindi kilala',
            s.quantity,
            money(s.selling_price),
            money(s.total_amount)
          ])
        );

      } else if (reportType === 'profit') {
        let totalSales = 0;
        let totalCost = 0;
        let estimatedCount = 0;

        sales.forEach(s => {
          const amount = Number(s.total_amount || 0);
          const quantity = Number(s.quantity || 0);
          const product = productMap.get(s.product_id);

          const unitCost =
            s.cost_price_at_sale !== null &&
            s.cost_price_at_sale !== undefined
              ? Number(s.cost_price_at_sale)
              : Number(product?.cost_price || 0);

          if (s.cost_price_at_sale === null ||
              s.cost_price_at_sale === undefined) {
            estimatedCount++;
          }

          totalSales += amount;
          totalCost += unitCost * quantity;
        });

        const grossProfit = totalSales - totalCost;

        const totalExpense = expenses.reduce(
          (sum, e) => sum + Number(e.amount || 0), 0
        );

        addSummary('Kabuuang Benta', money(totalSales));
        addSummary('Estimated Product Cost', money(totalCost));
        addSummary('Estimated Gross Profit', money(grossProfit));
        addSummary('Kabuuang Gastos', money(totalExpense));
        addSummary('Estimated Net Profit', money(grossProfit - totalExpense));

        const note = document.createElement('p');
        note.textContent = estimatedCount
          ? estimatedCount + ' sales record(s) ang gumagamit ng kasalukuyang product cost bilang estimate.'
          : 'Lahat ng sales ay may recorded historical cost.';

        details.appendChild(note);

        addTable(
          ['Petsa', 'Produkto', 'Sales', 'Product Cost', 'Gross Profit'],
          sales.map(s => {
            const product = productMap.get(s.product_id);
            const quantity = Number(s.quantity || 0);
            const amount = Number(s.total_amount || 0);
            const unitCost =
              s.cost_price_at_sale !== null &&
              s.cost_price_at_sale !== undefined
                ? Number(s.cost_price_at_sale)
                : Number(product?.cost_price || 0);

            const cost = unitCost * quantity;

            return [
              getDate(s.sell_date || s.sale_date),
              product?.name || 'Hindi kilala',
              money(amount),
              money(cost),
              money(amount - cost)
            ];
          })
        );

      } else if (reportType === 'expenses') {
        const total = expenses.reduce(
          (sum, e) => sum + Number(e.amount || 0), 0
        );

        addSummary('Kabuuang Gastos', money(total));
        addSummary('Bilang ng Gastos', expenses.length);

        addTable(
          ['Petsa', 'Category', 'Description', 'Amount'],
          expenses.map(e => [
            getDate(e.expense_date),
            e.category,
            e.description || '',
            money(e.amount)
          ])
        );

      } else if (reportType === 'inventory') {
        const totalValue = products.reduce(
          (sum, p) => sum +
            Number(p.stock_quantity || 0) *
            Number(p.cost_price || 0),
          0
        );

        addSummary('Kabuuang Produkto', products.length);
        addSummary('Inventory Value', money(totalValue));

        addTable(
          ['Produkto', 'Stock', 'Cost Price', 'Inventory Value', 'Status'],
          products.map(p => {
            const stock = Number(p.stock_quantity || 0);
            const cost = Number(p.cost_price || 0);
            const level = Number(p.low_stock_level || 0);

            const status = stock <= 0
              ? 'OUT OF STOCK'
              : level > 0 && stock <= level
                ? 'LOW STOCK'
                : 'AVAILABLE';

            return [
              p.name,
              stock,
              money(cost),
              money(stock * cost),
              status
            ];
          })
        );

      } else if (reportType === 'debts') {
        const outstanding = allDebts.reduce(
          (sum, d) => sum + Math.max(
            0,
            Number(d.amount || 0) - Number(d.amount_paid || 0)
          ), 0
        );

        addSummary('Kabuuang Natitirang Utang', money(outstanding));
        addSummary('Bilang ng Debt Records', allDebts.length);

        addTable(
          ['Customer', 'Total Debt', 'Paid', 'Balance', 'Date'],
          allDebts.map(d => [
            customerNames.get(d.customer_id) || 'Hindi kilalang customer',
            money(d.amount),
            money(d.amount_paid),
            money(Math.max(
              0,
              Number(d.amount || 0) - Number(d.amount_paid || 0)
            )),
            getDate(d.created_at)
          ])
        );
      }

      message.textContent =
        'Matagumpay na nagawa ang ' + titles[reportType] + '!';

    } catch (error) {
      message.textContent = 'Hindi nagawa ang report: ' + error.message;
    }
  }

  async function downloadBusinessBackup() {
    const message = document.getElementById('backupMessage');
    const button = document.querySelector(
      '#feature button[onclick="downloadBusinessBackup()"]'
    );

    if (!message) return;

    if (button) button.disabled = true;
    message.textContent = 'Kinukuha ang business records...';

    try {
      const businessId = await getBusinessId();

      // Kunin ang business profile
      const { data: business, error: businessError } = await db
        .from('businesses')
        .select('*')
        .eq('id', businessId)
        .single();

      if (businessError) throw businessError;

      // Kunin ang lahat ng records, 500 kada request
      async function fetchAllRecords(tableName) {
        const pageSize = 500;
        let allRows = [];
        let offset = 0;

        while (true) {
          const { data, error } = await db
            .from(tableName)
            .select('*')
            .eq('business_id', businessId)
            .range(offset, offset + pageSize - 1);

          if (error) {
            throw new Error(
              'Hindi makuha ang ' + tableName + ': ' + error.message
            );
          }

          const rows = data || [];
          allRows = allRows.concat(rows);

          if (rows.length < pageSize) break;

          offset += pageSize;
        }

        return allRows;
      }

      // I-download ang lahat ng business tables
      const tables = [
        'products',
        'customers',
        'sales',
        'debts',
        'debt_payments',
        'stock_movements',
        'expenses'
      ];

      const records = {};

      for (const tableName of tables) {
        message.textContent =
          'Kinukuha ang ' + tableName + '...';

        records[tableName] = await fetchAllRecords(tableName);
      }

      // Buuin ang backup file
      const backup = {
        app_name: 'NegosyoHub PH',
        backup_version: 1,
        exported_at: new Date().toISOString(),
        business: business,
        records: records,
        record_counts: Object.fromEntries(
          Object.entries(records).map(([name, rows]) => [
            name,
            rows.length
          ])
        )
      };

      const json = JSON.stringify(backup, null, 2);

      const blob = new Blob(
        [json],
        { type: 'application/json;charset=utf-8' }
      );

      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');

      const timestamp = new Date()
        .toISOString()
        .replace(/[:.]/g, '-');

      link.href = url;
      link.download =
        'NegosyoHub_PH_Backup_' + timestamp + '.json';

      document.body.appendChild(link);
      link.click();
      link.remove();

      setTimeout(() => URL.revokeObjectURL(url), 2000);

      const totalRecords = Object.values(records)
        .reduce((sum, rows) => sum + rows.length, 0);

      message.textContent =
        'Matagumpay ang backup! ' +
        totalRecords +
        ' records ang naisama sa JSON file.';

    } catch (error) {
      message.textContent =
        'Hindi nagawa ang backup: ' + error.message;

    } finally {
      if (button) button.disabled = false;
    }
  }

  async function validateBusinessBackup() {
    const message = document.getElementById('restoreBackupMessage');
    const preview = document.getElementById('restoreBackupPreview');
    const restoreButton = document.getElementById('restoreBusinessBackupButton');
    const fileInput = document.getElementById('restoreBackupFile');

    if (!message || !preview || !restoreButton || !fileInput) return;

    window.pendingBusinessBackup = null;
    restoreButton.disabled = true;
    preview.textContent = '';

    try {
      const file = fileInput.files[0];

      if (!file) {
        throw new Error('Pumili muna ng JSON backup file.');
      }

      const text = await file.text();
      const backup = JSON.parse(text);

      if (backup.app_name !== 'NegosyoHub PH' ||
          backup.backup_version !== 1) {
        throw new Error('Hindi valid na NegosyoHub PH backup file.');
      }

      const businessId = await getBusinessId();

      if (!backup.business || backup.business.id !== businessId) {
        throw new Error(
          'Hindi tugma ang backup sa kasalukuyang negosyo.'
        );
      }

      const tables = [
        'products',
        'customers',
        'sales',
        'debts',
        'debt_payments',
        'stock_movements',
        'expenses'
      ];

      let totalRecords = 0;
      const counts = [];

      for (const table of tables) {
        const rows = backup.records?.[table];

        if (!Array.isArray(rows)) {
          throw new Error('Kulang o invalid ang ' + table + ' records.');
        }

        const ids = new Set();

        for (const row of rows) {
          if (
            !row ||
            typeof row !== 'object' ||
            !row.id ||
            row.business_id !== businessId
          ) {
            throw new Error(
              'May invalid o ibang business record sa ' + table + '.'
            );
          }

          if (ids.has(row.id)) {
            throw new Error('May duplicate ID sa ' + table + '.');
          }

          ids.add(row.id);
        }

        totalRecords += rows.length;
        counts.push(table + ': ' + rows.length);
      }

      window.pendingBusinessBackup = backup;

      preview.textContent =
        'VALID ANG BACKUP!\n\n' +
        'Negosyo: ' + backup.business.name + '\n' +
        'Petsa ng Backup: ' + backup.exported_at + '\n\n' +
        counts.join('\n') +
        '\n\nKabuuang records: ' + totalRecords +
        '\n\nHanda na itong i-restore.';

      restoreButton.disabled = false;
      message.textContent = 'Matagumpay na nasuri ang backup!';

    } catch (error) {
      message.textContent = 'Hindi valid ang backup: ' + error.message;
      window.pendingBusinessBackup = null;
    }
  }


  async function restoreBusinessBackup() {
    const message = document.getElementById('restoreBackupMessage');
    const preview = document.getElementById('restoreBackupPreview');
    const restoreButton = document.getElementById('restoreBusinessBackupButton');

    if (!window.pendingBusinessBackup || !restoreButton) return;

    let completedTables = 0;
    const backup = window.pendingBusinessBackup;

    try {
      const businessId = await getBusinessId();

      if (backup.business.id !== businessId) {
        throw new Error('Hindi tugma ang negosyo sa backup.');
      }

      const confirmed = window.confirm(
        'SIGURADUHIN BAGO MAG-RESTORE\n\n' +
        'Ibabalik ang records mula sa backup.\n\n' +
        'Ang matching IDs ay maa-update, at ang bagong IDs ay idaragdag.\n' +
        'Hindi buburahin ang ibang kasalukuyang records.\n\n' +
        'Sigurado ka bang magpapatuloy?'
      );

      if (!confirmed) return;

      restoreButton.disabled = true;
      message.textContent = 'Nagsisimula ang restoration...';

      const tables = [
        'products',
        'customers',
        'debts',
        'sales',
        'debt_payments',
        'stock_movements',
        'expenses'
      ];

      let restoredRecords = 0;

      for (const table of tables) {
        const rows = backup.records[table];

        message.textContent = 'Ibinabalik ang ' + table + '...';

        for (let i = 0; i < rows.length; i += 200) {
          const batch = rows.slice(i, i + 200);

          const { error } = await db
            .from(table)
            .upsert(batch, { onConflict: 'id' });

          if (error) {
            throw new Error(table + ': ' + error.message);
          }

          restoredRecords += batch.length;
        }

        completedTables++;
      }

      message.textContent =
        'Matagumpay ang restore! ' +
        restoredRecords + ' records ang naibalik.';

      preview.textContent =
        'Tapos na ang restoration.\n' +
        'Mga table na naibalik: ' + completedTables + '\n' +
        'Kabuuang records: ' + restoredRecords;

      window.pendingBusinessBackup = null;
      restoreButton.disabled = true;

    } catch (error) {
      message.textContent =
        'May problema sa restore pagkatapos ng ' +
        completedTables + ' table(s): ' + error.message +
        '. Maaaring may naibalik nang records. Maaari mong ulitin ' +
        'ang restore dahil gumagamit ito ng record IDs.';
      restoreButton.disabled = false;
    }
  }

async function uploadAutomaticBusinessBackup() {
  if (autoBackupInProgress) return;

  autoBackupInProgress = true;

  const status = document.getElementById('autoBackupStatus');

  try {
    if (status) {
      status.textContent = 'Gumagawa ng automatic cloud backup...';
    }

    const businessId = await getBusinessId();

    const { data: business, error: businessError } = await db
      .from('businesses')
      .select('*')
      .eq('id', businessId)
      .single();

    if (businessError) throw businessError;

    const tables = [
      'products',
      'customers',
      'sales',
      'debts',
      'debt_payments',
      'stock_movements',
      'expenses'
    ];

    const records = {};

    for (const table of tables) {
      let allRows = [];
      let offset = 0;
      const pageSize = 500;

      while (true) {
        const { data, error } = await db
          .from(table)
          .select('*')
          .eq('business_id', businessId)
          .order('id', { ascending: true })
          .range(offset, offset + pageSize - 1);

        if (error) throw error;

        const rows = data || [];
        allRows = allRows.concat(rows);

        if (rows.length < pageSize) break;

        offset += pageSize;
      }

      records[table] = allRows;
    }

    const parts = new Intl.DateTimeFormat('en-US', {
      timeZone: 'Asia/Manila',
      year: 'numeric',
      month: '2-digit',
      day: '2-digit'
    }).formatToParts(new Date());

    const getPart = type =>
      parts.find(part => part.type === type).value;

    const backupDate =
      getPart('year') + '-' +
      getPart('month') + '-' +
      getPart('day');

    const backup = {
      app_name: 'NegosyoHub PH',
      backup_version: 1,
      backup_type: 'automatic_daily',
      exported_at: new Date().toISOString(),
      business: business,
      records: records,
      record_counts: Object.fromEntries(
        Object.entries(records).map(([name, rows]) => [
          name,
          rows.length
        ])
      )
    };

    const json = JSON.stringify(backup, null, 2);

    const blob = new Blob(
      [json],
      { type: 'application/json;charset=utf-8' }
    );

    if (blob.size > 50 * 1024 * 1024) {
      throw new Error('Lumampas sa 50 MB ang backup file.');
    }

    const filePath =
      businessId + '/daily-' + backupDate + '.json';

    const { error: uploadError } = await db
      .storage
      .from('business-backups')
      .upload(filePath, blob, {
        cacheControl: '0',
        contentType: 'application/json',
        upsert: true
      });

    if (uploadError) throw uploadError;

    if (status) {
      const totalRecords = Object.values(records)
        .reduce((sum, rows) => sum + rows.length, 0);

      status.textContent =
        '✅ Automatic cloud backup successful! ' +
        totalRecords + ' records. Petsa: ' + backupDate;
    }

  } catch (error) {
    if (status) {
      status.textContent =
        'Automatic backup failed: ' + error.message;
    }

  } finally {
    autoBackupInProgress = false;
  }
}


function startAutomaticBackup() {
  if (autoBackupTimer) {
    clearInterval(autoBackupTimer);
  }

  uploadAutomaticBusinessBackup();

  autoBackupTimer = setInterval(
    uploadAutomaticBusinessBackup,
    60 * 60 * 1000
  );
}

  async function signOut() {
    const { error } = await db.auth.signOut();

    if (error) {
      alert('Logout error: ' + error.message);
      return;
    }

    currentUser = null;
    currentBusinessId = null;
    productsCache = [];

    document.getElementById('dashboard').classList.add('hidden');
    document.getElementById('authSection').classList.remove('hidden');
    document.getElementById('message').textContent = 'Naka-logout ka na.';
  }

    async function checkSession() {
    const { data, error } = await db.auth.getSession();

    if (!error && data.session) {
      await showDashboard(data.session.user);

      startAutomaticBackup();
    }
  }

  checkSession();
