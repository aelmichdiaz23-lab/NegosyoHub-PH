<!DOCTYPE html>
<html lang="tl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#087f5b">st
  <title>NegosyoHub PH</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f7f5;
      color: #222;
    }
    header {
      background: #087f5b;
      color: white;
      text-align: center;
      padding: 20px 12px;
    }
    main { max-width: 700px; margin: auto; padding: 14px; }
    .card {
      background: white;
      padding: 16px;
      margin-bottom: 14px;
      border-radius: 12px;
      box-shadow: 0 2px 8px #0001;
    }
    input, select {
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 16px;
    }
    button {
      padding: 12px;
      margin: 4px 0;
      border: 0;
      border-radius: 7px;
      background: #087f5b;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }
    button:disabled { opacity: .5; }
    .full { width: 100%; }
    .menu { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .hidden { display: none; }
    .product {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px;
      margin: 8px 0;
      overflow-wrap: anywhere;
    }
    .muted { color: #666; font-size: 14px; }
    #message, #productMessage, #saleMessage { overflow-wrap: anywhere; }
  </style>
</head>
<body>
<header>
  <h1>NegosyoHub PH</h1>
  <p>Kaagapay sa iyong negosyo!</p>
</header>

<main>
  <section class="card" id="authSection">
    <h2>Mag-login o Gumawa ng Account</h2>
    <input id="email" type="email" placeholder="Email address" autocomplete="email">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">
    <button class="full" onclick="signIn()">Login</button>
    <button class="full" onclick="signUp()">Gumawa ng Account</button>
    <p id="message" role="status"></p>
  </section>

  <section class="card hidden" id="dashboard">
    <h2>Dashboard</h2>
    <p id="welcome"></p>
    <div class="menu">
      <button onclick="showFeature('Produkto')">📦 Produkto</button>
      <button onclick="showFeature('Stock')">📋 Stock Management</button>
      <button onclick="showFeature('Low Stock')">⚠️ Low Stock Alert</button>

      <button onclick="showFeature('Utang')">📝 Utang</button>
      <button onclick="showFeature('Reports')">📊 Reports</button>
      <button onclick="showFeature('Negosyo')">🏪 Negosyo</button>
    </div>
    <div class="card" id="feature">Pumili ng feature sa itaas.</div>
    <button onclick="signOut()">Logout</button>
  </section>
</main>

  async function signUp() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const message = document.getElementById('message');

    if (!email || password.length < 6) {
      message.textContent =
        'Ilagay ang email at password na hindi bababa sa 6 na character.';
      return;
    }

    message.textContent = 'Gumagawa ng account...';

    const { data, error } = await db.auth.signUp({
      email,
      password,
      options: { emailRedirectTo: SITE_URL }
    });

    if (error) {
      message.textContent = 'Error: ' + error.message;
      return;
    }

    if (data.session) {
      await showDashboard(data.session.user);
    } else {
      message.textContent =
        'Tingnan ang email mo at pindutin ang confirmation link.';
    }
  }

  async function signIn() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const message = document.getElementById('message');

    if (!email || !password) {
      message.textContent = 'Ilagay ang email at password.';
      return;
    }

    message.textContent = 'Nagla-login...';

    const { data, error } = await db.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      message.textContent = 'Login error: ' + error.message;
      return;
    }

    await showDashboard(data.user);
  }

  async function showDashboard(user) {
    currentUser = user;
    currentBusinessId = null;

    document.getElementById('authSection').classList.add('hidden');
    document.getElementById('dashboard').classList.remove('hidden');
    document.getElementById('welcome').textContent =
      'Naka-login bilang ' + (user.email || '');

    try {
      await getBusinessId();
    } catch (error) {
      document.getElementById('message').textContent =
        'Hindi makuha ang negosyo: ' + error.message;
    }
  }

  async function getBusinessId() {
    if (currentBusinessId) return currentBusinessId;

    if (!currentUser) {
      throw new Error('Mag-login muna sa account mo.');
    }

    const { data, error } = await db
      .from('businesses')
      .select('id')
      .eq('owner_id', currentUser.id)
      .limit(1);

    if (error) {
      throw new Error('Hindi makuha ang negosyo: ' + error.message);
    }

    if (!data || data.length === 0) {
      throw new Error('Walang negosyong naka-link sa account mo.');
    }

    currentBusinessId = data[0].id;
    return currentBusinessId;
  }

  async function loadSalesReport() {
    const message = document.getElementById('salesReportMessage');
    const summary = document.getElementById('salesReportSummary');
    const list = document.getElementById('salesReportList');
    const periodSelect = document.getElementById('salesReportPeriod');
    const refreshButton = document.getElementById('refreshSalesReport');

    if (!message || !summary || !list) return;

    if (refreshButton) refreshButton.disabled = true;
    message.textContent = 'Kinukuha ang sales report...';
    summary.replaceChildren();
    list.replaceChildren();

    try {
      const businessId = await getBusinessId();

      const { data: sales, error: salesError } = await db
        .from('sales')
        .select('product_id,quantity,selling_price,total_amount,sell_date')
        .eq('business_id', businessId)
        .order('sell_date', { ascending: false });

      if (salesError) throw salesError;

      const { data: products, error: productsError } = await db
        .from('products')
        .select('id,name')
        .eq('business_id', businessId);

      if (productsError) throw productsError;

      const productNames = new Map(
        (products || []).map(product => [product.id, product.name])
      );

      const allRecords = sales || [];
      const period = periodSelect ? periodSelect.value : 'all';
      let startDate = null;

      if (period !== 'all') {
        const now = new Date();
        startDate = new Date(now);
        startDate.setHours(0, 0, 0, 0);

        if (period === 'week') {
          const daysSinceMonday = (now.getDay() + 6) % 7;
          startDate.setDate(now.getDate() - daysSinceMonday);
        } else if (period === 'month') {
          startDate.setDate(1);
        }
      }

      const records = allRecords.filter(sale => {
        if (!startDate) return true;
        if (!sale.sell_date) return false;
        const saleDate = new Date(sale.sell_date);
        return !Number.isNaN(saleDate.getTime()) && saleDate >= startDate;
      });

      const totalSales = records.reduce(
        (sum, sale) => sum + Number(sale.total_amount || 0), 0
      );
      const totalItems = records.reduce(
        (sum, sale) => sum + Number(sale.quantity || 0), 0
      );

      const stats = [
        ['Kabuuang Benta', '₱' + totalSales.toFixed(2)],
        ['Bilang ng Transaksyon', String(records.length)],
        ['Kabuuang Produktong Nabenta', String(totalItems)]
      ];

      stats.forEach(([label, value]) => {
        const card = document.createElement('div');
        card.className = 'product';

        const title = document.createElement('strong');
        title.textContent = label;

        const detail = document.createElement('p');
        detail.textContent = value;

        card.append(title, detail);
        summary.appendChild(card);
      });

      const heading = document.createElement('h3');
      heading.textContent = 'Mga Detalye ng Benta';
      list.appendChild(heading);

      if (records.length === 0) {
        const empty = document.createElement('p');
        empty.className = 'muted';
        empty.textContent = 'Wala pang naitalang benta para sa napiling panahon.';
        list.appendChild(empty);
      } else {
        records.forEach(sale => {
          const card = document.createElement('div');
          card.className = 'product';

          const product = document.createElement('strong');
          product.textContent =
            productNames.get(sale.product_id) || 'Hindi matukoy na produkto';

          const date = document.createElement('p');
          const parsedDate = sale.sell_date ? new Date(sale.sell_date) : null;
          date.textContent = 'Petsa: ' + (
            parsedDate && !Number.isNaN(parsedDate.getTime())
              ? parsedDate.toLocaleString('fil-PH')
              : 'Walang petsa'
          );

          const details = document.createElement('p');
          details.textContent =
            'Dami: ' + Number(sale.quantity || 0) +
            ' | Presyo bawat isa: ₱' +
            Number(sale.selling_price || 0).toFixed(2);

          const amount = document.createElement('p');
          amount.textContent =
            'Kabuuang halaga: ₱' +
            Number(sale.total_amount || 0).toFixed(2);

          card.append(product, date, details, amount);
          list.appendChild(card);
        });
      }

      message.textContent = 'Matagumpay na nakuha ang Sales Report!';
    } catch (error) {
      message.textContent = 'Hindi makuha ang Sales Report: ' + error.message;
    } finally {
      if (refreshButton) refreshButton.disabled = false;
    }
  }

  async function saveProduct(event) {
    event.preventDefault();

    const message = document.getElementById('productMessage');
    const button = document.getElementById('saveProduct');

    button.disabled = true;
    message.textContent = 'Sine-save ang produkto...';

    try {
      const businessId = await getBusinessId();

      const product = {
        business_id: businessId,
        name: document.getElementById('pName').value.trim(),
        barcode: document.getElementById('pBarcode').value.trim() || null,
        cost_price: Number(document.getElementById('pCost').value),
        selling_price: Number(document.getElementById('pSelling').value),
        stock_quantity: Number(document.getElementById('pStock').value),
        low_stock_level: Number(document.getElementById('pLow').value || 5)
      };

      if (!product.name) throw new Error('Ilagay ang pangalan ng produkto.');

      if (
        product.cost_price < 0 ||
        product.selling_price < 0 ||
        product.stock_quantity < 0 ||
        product.low_stock_level < 0
      ) {
        throw new Error('Hindi puwedeng negatibo ang mga halaga.');
      }

      const { error } = await db.from('products').insert(product);
      if (error) throw error;

      message.textContent = 'Matagumpay na na-save ang produkto!';
      document.getElementById('productForm').reset();
      document.getElementById('pStock').value = 0;
      document.getElementById('pLow').value = 5;

      await loadProducts();
    } catch (error) {
      message.textContent = 'Hindi na-save: ' + error.message;
    } finally {
      button.disabled = false;
    }
  }

  async function loadProducts() {
    const list = document.getElementById('productList');
    if (!list) return;

    list.textContent = 'Kinukuha ang mga produkto...';

    try {
      const businessId = await getBusinessId();

      const { data, error } = await db
        .from('products')
        .select('id,name,barcode,cost_price,selling_price,stock_quantity,low_stock_level,created_at,business_id')
        .eq('business_id', businessId)
        .order('created_at', { ascending: false });

      if (error) throw error;

      productsCache = data || [];
      list.replaceChildren();

      if (!productsCache.length) {
        list.textContent = 'Wala pang produktong naidagdag.';
        return;
      }

      productsCache.forEach(product => {
        const item = document.createElement('div');
        item.className = 'product';

        const title = document.createElement('strong');
        title.textContent = product.name;
        item.appendChild(title);

        const details = document.createElement('p');
        details.textContent =
          'Puhunan: ₱' + Number(product.cost_price).toFixed(2) +
          ' | Benta: ₱' + Number(product.selling_price).toFixed(2);
        item.appendChild(details);

        const stock = document.createElement('p');
        stock.textContent =
          'Stock: ' + product.stock_quantity +
          ' | Babala kapag: ' + product.low_stock_level;
        item.appendChild(stock);

        if (product.barcode) {
          const barcode = document.createElement('p');
          barcode.textContent = 'Barcode: ' + product.barcode;
          item.appendChild(barcode);
        }

        if (Number(product.stock_quantity) <= Number(product.low_stock_level)) {
          const warning = document.createElement('p');
          warning.textContent = '⚠️ Mababang stock!';
          warning.style.color = '#b45309';
          item.appendChild(warning);
        }

        list.appendChild(item);
      });
    } catch (error) {
      list.textContent = 'Hindi makuha ang mga produkto: ' + error.message;
    }
  }

  async function loadSaleProducts() {
    const select = document.getElementById('saleProduct');

    try {
      const businessId = await getBusinessId();

      const { data, error } = await db
        .from('products')
        .select('id,name,cost_price,selling_price,stock_quantity')
        .eq('business_id', businessId)
        .order('name');

      if (error) throw error;

      productsCache = data || [];
      select.innerHTML = '<option value="">Piliin ang produkto</option>';

      productsCache.forEach(product => {
        const option = document.createElement('option');
        option.value = product.id;
        option.textContent =
          product.name + ' — stock: ' + product.stock_quantity;
        select.appendChild(option);
      });

      if (!productsCache.length) {
        select.innerHTML = '<option value="">Wala pang produkto</option>';
      }
    } catch (error) {
      select.innerHTML = '<option value="">Hindi makuha ang mga produkto</option>';
      document.getElementById('saleMessage').textContent =
        'Error: ' + error.message;
    }
  }

  function updateSalePreview() {
    const id = document.getElementById('saleProduct').value;
    const product = productsCache.find(p => p.id === id);
    const quantity = Number(document.getElementById('saleQty').value || 0);
    const price = Number(document.getElementById('salePrice').value || 0);
    const preview = document.getElementById('salePreview');

    if (!product) {
      preview.textContent = '';
      return;
    }

    document.getElementById('salePrice').value =
      document.getElementById('salePrice').value || product.selling_price;

    const actualPrice = Number(document.getElementById('salePrice').value || 0);
    preview.textContent =
      'Stock ngayon: ' + product.stock_quantity +
      ' | Kabuuang benta: ₱' + (quantity * actualPrice).toFixed(2) +
      ' | Tinatayang tubo: ₱' +
      (quantity * (actualPrice - Number(product.cost_price))).toFixed(2);
  }

  async function saveSale(event) {
    event.preventDefault();

    const message = document.getElementById('saleMessage');
    const button = document.getElementById('saveSale');

    button.disabled = true;
    message.textContent = 'Sine-save ang benta...';

    let saleSaved = false;

    try {
      const businessId = await getBusinessId();
      const productId = document.getElementById('saleProduct').value;
      const quantity = Number(document.getElementById('saleQty').value);
      const sellingPrice = Number(document.getElementById('salePrice').value);

      if (!productId) throw new Error('Pumili ng produkto.');

      if (!Number.isInteger(quantity) || quantity < 1) {
        throw new Error('Ilagay ang wastong dami ng nabenta.');
      }

      if (!Number.isFinite(sellingPrice) || sellingPrice < 0) {
        throw new Error('Suriin ang presyo ng benta.');
      }

      // Kunin ang pinakabagong stock bago mag-record ng benta.
      const { data: product, error: productError } = await db
        .from('products')
        .select('id,name,cost_price,selling_price,stock_quantity')
        .eq('id', productId)
        .eq('business_id', businessId)
        .single();

      if (productError) throw productError;

      if (quantity > Number(product.stock_quantity)) {
        throw new Error(
          'Kulang ang stock. Ang natitirang stock ay ' +
          product.stock_quantity + '.'
        );
      }

      const totalAmount = quantity * sellingPrice;

      // I-record muna ang benta.
      const { error: saleError } = await db
        .from('sales')
        .insert({
          business_id: businessId,
          product_id: product.id,
          quantity: quantity,
          selling_price: sellingPrice,
          total_amount: totalAmount,
          sell_date: new Date().toISOString(),
        });

      if (saleError) throw saleError;
      saleSaved = true;

      // Bawasan ang stock.
      const newStock = Number(product.stock_quantity) - quantity;

      const { data: updatedProduct, error: stockError } = await db
        .from('products')
        .update({ stock_quantity: newStock })
        .eq('id', product.id)
        .eq('business_id', businessId)
        .eq('stock_quantity', Number(product.stock_quantity))
        .select('id')
        .maybeSingle();

      if (stockError) {
        throw new Error(
          'NA-RECORD ANG BENTA PERO HINDI NABAWAS ANG STOCK. ' +
          'Huwag ulitin ang benta. Error: ' + stockError.message
        );
      }

      if (!updatedProduct) {
        throw new Error(
          'NA-RECORD ANG BENTA PERO HINDI NA-UPDATE ANG STOCK. ' +
          'Huwag ulitin ang benta. I-refresh at suriin muna ang stock.'
        );
      }

// Hindi kailangan ang process_sale_stock RPC dito dahil na-update na
      // ang stock sa itaas sa pamamagitan ng products.update().

      document.getElementById('saleForm').reset();

      message.textContent =
        'Matagumpay ang benta! Kabuuan: ₱' +
        totalAmount.toFixed(2) +
        '. Nabawasan ang stock ng ' + quantity + '.';

      await loadSaleProducts();
      updateSalePreview();

    } catch (error) {
      message.textContent =
        (saleSaved ? 'BABALA: Maaaring na-save na ang benta. ' : 'Hindi na-save: ') +
        error.message;
    } finally {
      button.disabled = false;
    }
  }

  async function loadDebts() {
    const list = document.getElementById('debtList');
    if (!list) return;

    list.textContent = 'Kinukuha ang mga utang...';

    try {
      const businessId = await getBusinessId();

      const { data: debts, error: debtError } = await db
        .from('debts')
        .select('id,customer_id,amount,amount_paid,notes,created_at')
        .eq('business_id', businessId)
        .order('created_at', { ascending: false });

      if (debtError) throw debtError;

      const { data: customers, error: customerError } = await db
        .from('customers')
        .select('id,name')
        .eq('business_id', businessId);

      if (customerError) throw customerError;

      const { data: payments, error: paymentError } = await db
        .from('debt_payments')
        .select('id,debt_id,amount,payment_date,notes')
        .eq('business_id', businessId)
        .order('payment_date', { ascending: false });

      if (paymentError) throw paymentError;

      const customerNames = new Map(
        (customers || []).map(c => [c.id, c.name])
      );

      list.replaceChildren();

      const records = debts || [];

      if (!records.length) {
        list.textContent = 'Wala pang naitalang utang.';
        return;
      }

      records.forEach(debt => {
        const item = document.createElement('div');
        item.className = 'product';

        const total = Number(debt.amount || 0);
        const paid = Number(debt.amount_paid || 0);
        const balance = Math.max(0, total - paid);

        const title = document.createElement('strong');
        title.textContent =
          customerNames.get(debt.customer_id) || 'Hindi kilalang customer';

        const details = document.createElement('p');
        details.textContent =
          'Petsa: ' + new Date(debt.created_at).toLocaleDateString('en-PH') +
          ' | Kabuuang utang: ₱' + total.toFixed(2);

        const payment = document.createElement('p');
        payment.textContent = 'Naibayad: ₱' + paid.toFixed(2);

        const remaining = document.createElement('p');
        remaining.textContent = 'Natitirang utang: ₱' + balance.toFixed(2);
        remaining.style.fontWeight = 'bold';

        const status = document.createElement('p');
        status.textContent =
          balance <= 0 ? '✅ FULLY PAID' : '⏳ MAY BALANSE PA';

        item.append(title, details, payment, remaining, status);

        if (debt.notes) {
          const note = document.createElement('p');
          note.textContent = 'Notes: ' + debt.notes;
          item.appendChild(note);
        }

        const historyTitle = document.createElement('h4');
        historyTitle.textContent = 'Kasaysayan ng Bayad';
        item.appendChild(historyTitle);

        const debtPayments = (payments || []).filter(
          p => p.debt_id === debt.id
        );

        if (!debtPayments.length) {
          const noPayment = document.createElement('p');
          noPayment.textContent = 'Wala pang naitatalang bayad.';
          item.appendChild(noPayment);
        } else {
          debtPayments.forEach(p => {
            const paymentDetails = document.createElement('p');
            paymentDetails.textContent =
              new Date(p.payment_date).toLocaleDateString('en-PH') +
              ' — ₱' + Number(p.amount).toFixed(2) +
              (p.notes ? ' (' + p.notes + ')' : '');

            item.appendChild(paymentDetails);
          });
        }

        if (balance > 0) {
          const paymentTitle = document.createElement('h4');
          paymentTitle.textContent = 'Mag-record ng Bayad';

          const amountInput = document.createElement('input');
          amountInput.type = 'number';
          amountInput.min = '0.01';
          amountInput.max = balance.toFixed(2);
          amountInput.step = '0.01';
          amountInput.placeholder = 'Halaga ng ibinayad (₱)';

          const notesInput = document.createElement('input');
          notesInput.type = 'text';
          notesInput.maxLength = 250;
          notesInput.placeholder = 'Notes sa bayad (opsyonal)';

          const payButton = document.createElement('button');
          payButton.type = 'button';
          payButton.textContent = 'I-record ang Bayad';

          payButton.addEventListener('click', async () => {
            const amount = Number(amountInput.value);
            const message = document.getElementById('debtMessage');

            try {
              if (!Number.isFinite(amount) || amount <= 0) {
                throw new Error('Ilagay ang wastong halaga ng bayad.');
              }

              if (amount > balance + 0.000001) {
                throw new Error(
                  'Sobra ang bayad. Natitirang balanse: ₱' +
                  balance.toFixed(2)
                );
              }

              payButton.disabled = true;
              message.textContent = 'Sine-save ang bayad...';

              const { data, error } = await db.rpc(
                'record_debt_payment',
                {
                  p_debt_id: debt.id,
                  p_amount: amount,
                  p_notes: notesInput.value.trim() || null
                }
              );

              if (error) throw error;

              message.textContent =
                'Matagumpay na naitala ang bayad! Natitirang balanse: ₱' +
                Number(data.remaining_balance).toFixed(2);

              await loadDebts();

            } catch (error) {
              message.textContent =
                'Hindi naitala ang bayad: ' + error.message;
            } finally {
              payButton.disabled = false;
            }
          });

          item.append(paymentTitle, amountInput, notesInput, payButton);
        }

        list.appendChild(item);
      });

    } catch (error) {
      list.textContent = 'Hindi makuha ang mga utang: ' + error.message;
    }
  }

  async function saveStockAdjustment(event) {
    event.preventDefault();

    const message = document.getElementById('stockMessage');
    const button = document.querySelector('#stockForm button[type="submit"]');

    button.disabled = true;
    message.textContent = 'Sine-save ang pagbabago ng stock...';

    try {
      const productId = document.getElementById('stockProduct').value;
      const direction = document.getElementById('stockDirection').value;
      const amount = Number(document.getElementById('stockAmount').value);
      const reason = document.getElementById('stockReason').value.trim();

      if (!productId) throw new Error('Pumili ng produkto.');

      if (!Number.isFinite(amount) || amount <= 0) {
        throw new Error('Ilagay ang wastong dami.');
      }

      if (!reason) throw new Error('Ilagay ang dahilan ng pagbabago ng stock.');

      const quantityChange = direction === 'out' ? -amount : amount;

      const { data, error } = await db.rpc('adjust_product_stock', {
        p_product_id: productId,
        p_quantity_change: quantityChange,
        p_reason: reason
      });

      if (error) throw error;

      message.textContent =
        'Matagumpay na na-update ang stock! Bagong stock: ' +
        Number(data.stock_after).toLocaleString('en-PH');

      document.getElementById('stockForm').reset();

      await loadStockProducts();
      await loadStockMovements();

    } catch (error) {
      message.textContent = 'Hindi na-save: ' + error.message;
    } finally {
      button.disabled = false;
    }
  }

  async function loadStockMovements() {
    const list = document.getElementById('stockHistory');
    if (!list) return;

    list.textContent = 'Kinukuha ang stock history...';

    try {
      const businessId = await getBusinessId();

      const { data: movements, error } = await db
        .from('stock_movements')
        .select('id,product_id,quantity_change,reason,created_at')
        .eq('business_id', businessId)
        .order('created_at', { ascending: false });

      if (error) throw error;

      const { data: products, error: productError } = await db
        .from('products')
        .select('id,name')
        .eq('business_id', businessId);

      if (productError) throw productError;

      const productNames = new Map(
        (products || []).map(product => [product.id, product.name])
      );

      list.replaceChildren();

      if (!movements || movements.length === 0) {
        list.textContent = 'Wala pang stock movement.';
        return;
      }

      movements.forEach(movement => {
        const item = document.createElement('div');
        item.className = 'product';

        const title = document.createElement('strong');
        title.textContent =
          productNames.get(movement.product_id) || 'Hindi kilalang produkto';

        const quantity = Number(movement.quantity_change);
        const details = document.createElement('p');
        details.textContent =
          (quantity > 0 ? 'Stock-in: +' : 'Stock-out: ') +
          Math.abs(quantity).toLocaleString('en-PH');

        const date = document.createElement('p');
        date.textContent =
          'Petsa: ' +
          new Date(movement.created_at).toLocaleString('en-PH');

        const reason = document.createElement('p');
        reason.textContent = 'Dahilan: ' + movement.reason;

        item.append(title, details, date, reason);
        list.appendChild(item);
      });

    } catch (error) {
      list.textContent = 'Hindi makuha ang stock history: ' + error.message;
    }
  }
  
  async function signOut() {
    const { error } = await db.auth.signOut();

    if (error) {
      alert('Logout error: ' + error.message);
      return;
    }

    currentUser = null;
    currentBusinessId = null;

    document.getElementById('dashboard').classList.add('hidden');

    document.getElementById('message').textContent = 'Naka-logout ka na.';

  async function checkSession() {
    const { data, error } = await db.auth.getSession();

    if (!error && data.session) {
      await showDashboard(data.session.user);
    }
  }

  checkSession();
